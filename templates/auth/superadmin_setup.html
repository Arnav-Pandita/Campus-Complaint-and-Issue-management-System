<!DOCTYPE html>
<html>
<head>
    <title>Initial Superadmin Setup</title>
</head>
<body>

    <h1>Initial Superadmin Setup</h1>

    <p>Create the first superadmin account for the system.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Full Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" required><br><br>

        <label>College ID</label><br>
        <input type="text" name="college_id" required><br><br>

        <label>Password (minimum 8 characters)</label><br>
        <input type="password" name="password" minlength="8" required><br><br>

        <label>Confirm Password</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <label>Superadmin Setup Key</label><br>
        <input type="password" name="setup_key" required><br><br>

        <button type="submit">Create Superadmin</button>

    </form>

</body>
</html>
